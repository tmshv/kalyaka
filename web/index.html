<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kalyaka</title>
<meta name="description" content="A shared drawing sheet. Open one, send the link, and draw on it together in real time.">
<meta property="og:title" content="kalyaka">
<meta property="og:description" content="A shared drawing sheet. Draw on it together in real time.">
<meta name="theme-color" content="#0f2d52">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/ibm-plex-sans-condensed-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v=__V__">
<script src="/static/vendor/centrifuge.js?v=__V__" defer></script>
<script src="/static/app.js?v=__V__" defer></script>
</head>
<body>

<main id="home" class="home" hidden>
  <section class="intro">
    <h1 class="wordmark">kalyaka</h1>
    <p class="lede">A shared drawing sheet. Open one, send the link, and draw on it together in real time.</p>
    <p class="muted">Sheets aren't stored. When the last person leaves, the sheet is cleared.</p>

    <form id="open-form" class="block open-form" autocomplete="off">
      <div class="cell cell-label"><label for="room-input">Sheet</label></div>
      <div class="cell address">
        <span id="host-prefix" class="host"></span>
        <input id="room-input" name="room" maxlength="40" spellcheck="false" autocapitalize="off" required
               pattern="[a-zA-Z0-9][a-zA-Z0-9\-]*" title="Letters, digits and dashes">
        <button type="button" id="reroll" class="icon" aria-label="Another random name" title="Another random name">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 8A6 6 0 0 0 4.6 6.4M4.5 12a6 6 0 0 0 10.9 1.6"/><path d="M15.5 3.5V8H11M4.5 16.5V12H9"/></svg>
        </button>
      </div>
      <button type="submit" class="cell submit">Open sheet</button>
    </form>
  </section>

  <svg class="construction" viewBox="0 0 480 480" aria-hidden="true" focusable="false">
    <g class="faint">
      <path d="M40 240H440M240 40V440"/>
      <path d="M98 98L382 382M382 98L98 382"/>
    </g>
    <g class="ink">
      <path class="d1" d="M98 98H382V382H98Z"/>
      <circle class="d2" cx="240" cy="240" r="142"/>
      <circle class="d3" cx="240" cy="240" r="71"/>
      <path class="d4" d="M240 240L340.4 139.6"/>
      <path class="d5" d="M90 428H390M98 418V438M382 418V438M92 434L104 422M376 434L388 422"/>
    </g>
    <text class="dim" x="240" y="420" text-anchor="middle">284</text>
    <text class="dim" x="302" y="214">R 142</text>
  </svg>
</main>

<div id="board" class="board" hidden>
  <canvas id="canvas" aria-label="Drawing sheet"></canvas>
  <div id="cursors" class="layer" aria-hidden="true"></div>
  <div id="reactions-layer" class="layer" aria-hidden="true"></div>
  <div id="measure" class="measure" hidden aria-hidden="true"></div>
  <p id="hint" class="hint">Pick a tool and draw. Everyone with this link draws on the same sheet.</p>

  <header class="bar top-left">
    <a href="/" class="mark" title="New sheet">kalyaka</a>
    <span class="sep" aria-hidden="true"></span>
    <span id="room-name" class="room-name"></span>
    <button type="button" id="copy-link" class="text-btn">Copy link</button>
  </header>

  <div class="bar top-right" role="group" aria-label="Sheet actions">
    <button type="button" id="undo" class="icon" aria-label="Undo your last shape (Ctrl+Z)" title="Undo your last shape (Ctrl+Z)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5L3.5 9l4 4"/><path d="M3.5 9H12a4.5 4.5 0 0 1 0 9h-2"/></svg>
    </button>
    <button type="button" id="save" class="icon" aria-label="Export PNG" title="Export PNG">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9.5M6 9l4 4 4-4M3.5 14.5v2h13v-2"/></svg>
    </button>
    <button type="button" id="clear" class="text-btn danger" aria-label="Clear the sheet for everyone" title="Clear the sheet for everyone">Clear</button>
  </div>

  <nav class="rail" aria-label="Drawing tools">
    <div class="group" role="group" aria-label="Tool">
      <button type="button" class="icon tool" data-tool="pen" aria-pressed="true" aria-label="Pen (P)" title="Pen (P)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5l1-3.8 8.6-8.6a1.5 1.5 0 0 1 2.1 0l.7.7a1.5 1.5 0 0 1 0 2.1l-8.6 8.6z"/><path d="M11.6 5.6l2.8 2.8"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="line" aria-pressed="false" aria-label="Line (L)" title="Line (L)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.4"/><circle cx="16" cy="4" r="1.4"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="arrow" aria-pressed="false" aria-label="Arrow (A)" title="Arrow (A)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16L16 4M9.5 4H16v6.5"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="rect" aria-pressed="false" aria-label="Rectangle (R)" title="Rectangle (R)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="5.5" width="13" height="9"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="circle" aria-pressed="false" aria-label="Circle from center (C)" title="Circle from center (C)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle class="o" cx="10" cy="10" r="6.5"/><path d="M10 10h6.5"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="dim" aria-pressed="false" aria-label="Dimension: click two points, then place the line (D)" title="Dimension: click two points, then place the line (D)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V5M16 16V5M3 8.5h14"/><path d="M2.5 10l3-3M14.5 10l3-3"/></svg>
      </button>
      <button type="button" class="icon tool" data-tool="erase" aria-pressed="false" aria-label="Eraser (E)" title="Eraser (E)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 16.5L3.6 12.6a1.4 1.4 0 0 1 0-2l6.8-6.8a1.4 1.4 0 0 1 2 0l4.4 4.4a1.4 1.4 0 0 1 0 2L10.3 16.5M7.5 16.5h9"/><path d="M6.4 7.8l5.8 5.8"/></svg>
      </button>
    </div>
    <div class="group" role="group" aria-label="Line weight">
      <button type="button" class="icon weight" data-weight="1" aria-pressed="true" aria-label="Weight 1 px (1)" title="Weight 1 px (1)"><span></span></button>
      <button type="button" class="icon weight" data-weight="2" aria-pressed="false" aria-label="Weight 2 px (2)" title="Weight 2 px (2)"><span></span></button>
      <button type="button" class="icon weight" data-weight="4" aria-pressed="false" aria-label="Weight 4 px (3)" title="Weight 4 px (3)"><span></span></button>
    </div>
    <div class="group" role="group" aria-label="Ink" id="inks"></div>
    <div class="group">
      <button type="button" id="snap" class="icon" aria-pressed="false" aria-label="Snap to grid (G)" title="Snap to grid (G)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7h14M3 13h14M7 3v14M13 3v14"/><circle cx="13" cy="7" r="1.8" class="fill"/></svg>
      </button>
    </div>
  </nav>

  <div class="title-block" aria-label="Sheet details">
    <div class="tb-row tb-head">
      <span class="tb-mark">kalyaka</span>
      <span id="tb-room" class="tb-value"></span>
    </div>
    <div class="tb-row">
      <span class="tb-key">Drawn by</span>
      <ul id="people" class="people">
        <li id="me-row" class="person me">
          <span class="swatch-dot"></span>
          <button type="button" id="me-name" class="person-name" title="Change your name"></button>
          <form id="rename-form" class="rename" hidden><input id="rename-input" maxlength="32" aria-label="Your name" spellcheck="false"></form>
        </li>
      </ul>
    </div>
    <div class="tb-row tb-split">
      <span class="tb-key">Date</span><span id="tb-date" class="tb-value num"></span>
      <span class="tb-key">Grid</span><span id="tb-grid" class="tb-value num"></span>
    </div>
  </div>

  <div class="bar reactions" role="group" aria-label="Send a reaction" id="reactions"></div>

  <div id="coords" class="coords num" aria-hidden="true"></div>
  <div id="status" class="notice" role="status" hidden></div>
  <div id="toast" class="notice toast" role="status" aria-live="polite" hidden></div>
</div>

<noscript><p class="noscript">kalyaka needs JavaScript to draw.</p></noscript>
</body>
</html>
